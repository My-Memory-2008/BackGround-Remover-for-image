<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Powered Interactive AI Background Keeper</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .canvas-container { position: relative; display: inline-block; border: 2px dashed #444; margin-top: 15px; max-width: 100%; }
        #sourceImage { max-width: 100%; display: block; max-height: 60vh; }
        #interactionCanvas { position: absolute; top:0; left:0; width:100%; height:100%; cursor: crosshair; }
        button, input { padding: 10px 20px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
        #processBtn { background: #28a745; color: white; }
        #clearBtn { background: #dc3545; color: white; }
        #status { background: #222; padding: 12px; border-radius: 8px; border: 1px solid #333; color: #ffc107; font-weight: bold; min-width: 300px; }
        #resultCanvas { margin-top: 20px; border: 2px solid #00ffcc; max-width: 100%; background-image: repeating-conic-gradient(#333 0% 25%, #222 0% 50%); background-size: 20px 20px; }
    </style>
</head>
<body>

    <h1>Interactive AI Background Keeper (Google MediaPipe)</h1>
    <p>Click your subject AND background text layers like "Chloe" to keep them from being removed!</p>

    <div class="container">
        <input type="file" id="imageUpload" accept="image/*">
        <div id="status">⏳ Spawning isolated Google AI engine background thread...</div>

        <div class="canvas-container" id="workspace" style="display:none;">
            <img id="sourceImage" alt="Upload source">
            <canvas id="interactiveCanvas"></canvas>
        </div>

        <div>
            <button id="clearBtn" disabled>Clear Clicks</button>
            <button id="processBtn" disabled>Run AI Extract Cutout</button>
        </div>

        <h3>Output Asset PNG Layer:</h3>
        <canvas id="resultCanvas"></canvas>
    </div>

<script>
    const status = document.getElementById('status');
    const imageUpload = document.getElementById('imageUpload');
    const workspace = document.getElementById('workspace');
    const sourceImage = document.getElementById('sourceImage');
    const interactiveCanvas = document.getElementById('interactiveCanvas');
    const interCtx = interactiveCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const resCtx = resultCanvas.getContext('2d');
    const processBtn = document.getElementById('processBtn');
    const clearBtn = document.getElementById('clearBtn');

    let clickPoints = [];
    let mediaPipeWorker = null;

    // 1. Thread Connection Pipeline
    function initWorker() {
        // Instantiate thread worker referencing local source
        mediaPipeWorker = new Worker('./mediapipe-worker.js');
        
        // Command initialization sequence
        mediaPipeWorker.postMessage({ action: 'load' });

        // Catch runtime response data streams
        mediaPipeWorker.onmessage = function(e) {
            const data = e.data;

            if (data.status === 'ready') {
                status.innerText = "🚀 Google AI Engine Ready! Choose an image file above.";
            } else if (data.status === 'complete') {
                renderMaskOutput(data.maskData);
            } else if (data.status === 'error') {
                status.innerText = `❌ Error: ${data.error}`;
            } else {
                status.innerText = data.status; // Render general text alerts
            }
        };
    }
    initWorker();

    // 2. Handle Asset Image Upload Setup
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files;
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            sourceImage.src = event.target.result;
            sourceImage.onload = () => {
                workspace.style.display = 'inline-block';
                interactiveCanvas.width = sourceImage.clientWidth;
                interactiveCanvas.height = sourceImage.clientHeight;
                
                clickPoints = [];
                interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
                resCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
                
                clearBtn.disabled = false;
                processBtn.disabled = false;
                status.innerText = "🎯 Click on your subject AND your background text ('Chloe') to protect them.";
            };
        };
        reader.readAsDataURL(file);
    });

    // 3. Keep Track of Click Coordinates
    interactiveCanvas.addEventListener('click', (e) => {
        const rect = interactiveCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / interactiveCanvas.width;
        const y = (e.clientY - rect.top) / interactiveCanvas.height;

        clickPoints.push({ x, y });

        // Draw indicator node dot marker
        interCtx.fillStyle = '#00ffcc';
        interCtx.beginPath();
        interCtx.arc(e.clientX - rect.left, e.clientY - rect.top, 7, 0, 2 * Math.PI);
        interCtx.fill();
    });

    clearBtn.addEventListener('click', () => {
        clickPoints = [];
        interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
        resCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        status.innerText = "Tracking points flushed. Mark new points.";
    });

    // 4. Pass Data Objects to Worker Thread
    processBtn.addEventListener('click', () => {
        if (clickPoints.length === 0) {
            alert("Please mark at least one section layer to save first!");
            return;
        }

        status.innerText = "⚡ Worker processing mask on background thread...";

        // Capture raw pixel data arrays from the source image frame
        const canvasTemp = document.createElement('canvas');
        canvasTemp.width = sourceImage.naturalWidth;
        canvasTemp.height = sourceImage.naturalHeight;
        const ctxTemp = canvasTemp.getContext('2d');
        ctxTemp.drawImage(sourceImage, 0, 0);
        
        const rawImageData = ctxTemp.getImageData(0, 0, canvasTemp.width, canvasTemp.height);

        // Send pixel matrix payload to mediapipe-worker.js
        mediaPipeWorker.postMessage({
            action: 'segment',
            imageData: rawImageData,
            clickPoints: clickPoints
        });
    });

    // 5. Draw Final Transparency Alpha Blends
    function renderMaskOutput(masterMask) {
        const trueWidth = sourceImage.naturalWidth;
        const trueHeight = sourceImage.naturalHeight;
        resultCanvas.width = trueWidth;
        resultCanvas.height = trueHeight;

        resCtx.drawImage(sourceImage, 0, 0, trueWidth, trueHeight);
        const imageFramePixels = resCtx.getImageData(0, 0, trueWidth, trueHeight);

        // Apply our master selection mask to the image alpha channel
        for (let i = 0; i < masterMask.length; i++) {
            const pixelAlphaByteIndex = (i * 4) + 3;
            // 0 means background segment -> Erase it instantly
            if (masterMask[i] === 0) {
                imageFramePixels.data[pixelAlphaByteIndex] = 0;
            }
        }

        resCtx.putImageData(imageFramePixels, 0, 0);
        status.innerText = "🎉 Process complete! Transparency cutout rendered.";
    }
</script>
</body>
</html>
