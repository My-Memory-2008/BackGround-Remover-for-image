<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Background Eraser & Keeper</title>
    <!-- Import Google MediaPipe Vision Library Tasks -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 90vw;
            border: 2px dashed #444;
            border-radius: 8px;
            overflow: hidden;
        }
        /* Layers stacked exactly over each other */
        #sourceImage {
            display: block;
            max-width: 600px;
            height: auto;
        }
        #interactionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
        .controls {
            margin: 10px;
            display: flex;
            gap: 10px;
        }
        button, input[type="file"] {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        button {
            background-color: #007bff;
            color: white;
        }
        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }
        #status {
            color: #ffc107;
            font-weight: bold;
        }
        #resultCanvas {
            margin-top: 20px;
            border: 2px solid #28a745;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), 
                              linear-gradient(-45deg, #222 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #222 75%), 
                              linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body>

    <h1>AI Interactive Object Keeper</h1>
    <p>Upload an image. <strong>Click or Draw lines</strong> on the main subject AND things like text ("Chloe") to force the AI to keep them!</p>

    <div class="container">
        <input type="file" id="fileUpload" accept="image/*">
        <div id="status">Loading AI Engine...</div>

        <div class="image-wrapper">
            <img id="sourceImage" src="" alt="Upload an image to begin" style="display:none;">
            <canvas id="interactionCanvas"></canvas>
        </div>

        <div class="controls">
            <button id="clearBtn" disabled>Clear Clicks</button>
            <button id="processBtn" disabled>Extract Selection (Cutout)</button>
        </div>

        <h3>Output Result:</h3>
        <canvas id="resultCanvas" width="0" height="0"></canvas>
    </div>

<script>
    // Grab UI Elements
    const fileUpload = document.getElementById('fileUpload');
    const sourceImage = document.getElementById('sourceImage');
    const interactionCanvas = document.getElementById('interactionCanvas');
    const interCtx = interactionCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const resCtx = resultCanvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const clearBtn = document.getElementById('clearBtn');
    const processBtn = document.getElementById('processBtn');

    let interactiveSegmenter;
    let clickPoints = []; // Stores user mouse actions

    // 1. Initialize Google MediaPipe Interactive Segmenter Model Natively
    async function initAI() {
        try {
            const vision = await FilesetResolver.forVisionTasks(
                "https://jsdelivr.net"
            );
            
            interactiveSegmenter = await InteractiveSegmenter.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://googleapis.com",
                    delegate: "GPU" // Uses WebGL acceleration dynamically
                },
                outputCategoryMask: true,
                outputConfidenceMask: false
            });
            
            statusDiv.innerText = "AI Engine Ready! Please upload your photo.";
        } catch (error) {
            statusDiv.innerText = "Initialization failed. Run this file via a local server.";
            console.error(error);
        }
    }
    initAI();

    // 2. Handle Image Upload & Scaling
    fileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            sourceImage.src = event.target.result;
            sourceImage.style.display = "block";
            
            sourceImage.onload = () => {
                // Uniformly sync the interactive display canvas size with the image scaling
                interactionCanvas.width = sourceImage.clientWidth;
                interactionCanvas.height = sourceImage.clientHeight;
                
                // Clear any leftover data points
                clickPoints = [];
                interCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
                
                clearBtn.disabled = false;
                processBtn.disabled = false;
                statusDiv.innerText = "Click/Tap on ALL items you want to keep (e.g. background text & foreground subject).";
            };
        };
        reader.readAsDataURL(file);
    });

    // 3. Register user selection points on the canvas layer
    interactionCanvas.addEventListener('click', (e) => {
        const rect = interactionCanvas.getBoundingClientRect();
        // Compute normalized coordinate ratio scale needed by the AI runtime (0.0 to 1.0)
        const clickX = (e.clientX - rect.left) / interactionCanvas.width;
        const clickY = (e.clientY - rect.top) / interactionCanvas.height;

        // Save selection details
        clickPoints.push({ x: clickX, y: clickY });

        // Draw a glowing visual anchor marker where the user targeted
        interCtx.fillStyle = '#00ffcc';
        interCtx.beginPath();
        interCtx.arc(e.clientX - rect.left, e.clientY - rect.top, 6, 0, 2 * Math.PI);
        interCtx.fill();
    });

    // Reset controls
    clearBtn.addEventListener('click', () => {
        clickPoints = [];
        interCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
        statusDiv.innerText = "Points cleared. Click again to specify targets.";
    });

    // 4. Fire Interactive Segmentation Inference Core Pipeline
    processBtn.addEventListener('click', async () => {
        if (clickPoints.length === 0) {
            alert("Please make at least one click point on your subject or text before running!");
            return;
        }

        statusDiv.innerText = "AI is computing your customized mask...";

        // Set up execution dimensions
        const originWidth = sourceImage.naturalWidth;
        const originHeight = sourceImage.naturalHeight;
        resultCanvas.width = originWidth;
        resultCanvas.height = originHeight;

        // Create an aggregated master mask 
        const masterAlphaBuffer = new Uint8Array(originWidth * originHeight).fill(0);

        // Run an inference block loop for every coordinate provided by the developer/user
        for (let pt of clickPoints) {
            // MediaPipe processes one coordinate layout instruction per call block
            const poi = { keypoint: { x: pt.x, y: pt.y } };
            
            await new Promise((resolve) => {
                interactiveSegmenter.segment(sourceImage, poi, (result) => {
                    const maskData = result.categoryMask.getAsUint8Array();
                    
                    // Logical OR combination: Merge pixel selections 
                    for (let i = 0; i < maskData.length; i++) {
                        if (maskData[i] > 0) {
                            masterAlphaBuffer[i] = 255;
                        }
                    }
                    resolve();
                });
            });
        }

        // 5. Blending Output Canvas Rendering
        // Paint down raw original texture image properties
        resCtx.drawImage(sourceImage, 0, 0, originWidth, originHeight);
        const frameData = resCtx.getImageData(0, 0, originWidth, originHeight);

        // Inject combined structural alpha channel information across matching indices
        for (let i = 0; i < masterAlphaBuffer.length; i++) {
            const pixelAlphaIndex = (i * 4) + 3;
            // Map categorical visibility output arrays onto base frame properties
            frameData.data[pixelAlphaIndex] = masterAlphaBuffer[i];
        }

        // Draw structural output composition onto final UI layout frame
        resCtx.putImageData(frameData, 0, 0);
        statusDiv.innerText = "Done! Combined segments extracted successfully.";
    });
</script>
</body>
</html>
