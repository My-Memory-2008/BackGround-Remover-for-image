<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive AI Background Keeper</title>
    <!-- Official Stable Google MediaPipe Vision CDN -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .canvas-container { position: relative; display: inline-block; border: 2px dashed #444; margin-top: 15px; max-width: 100%; }
        #sourceImage { max-width: 100%; display: block; max-height: 60vh; }
        #interactionCanvas { position: absolute; top:0; left:0; width:100%; height:100%; cursor: crosshair; }
        button, input { padding: 10px 20px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
        #processBtn { background: #28a745; color: white; }
        #clearBtn { background: #dc3545; color: white; }
        button:disabled { background: #444 !important; color: #888; cursor: not-allowed; }
        #status { background: #222; padding: 12px; border-radius: 8px; border: 1px solid #333; color: #ffc107; font-weight: bold; min-width: 320px; }
        #resultCanvas { margin-top: 20px; border: 2px solid #00ffcc; max-width: 100%; background-image: repeating-conic-gradient(#333 0% 25%, #222 0% 50%); background-size: 20px 20px; }
    </style>
</head>
<body>

    <h1>Interactive AI Background Keeper</h1>
    <p>Click your subject AND background words like "Chloe" to keep them from being removed!</p>

    <div class="container">
        <input type="file" id="imageUpload" accept="image/*">
        <div id="status">⏳ Initializing Google AI Engine Components...</div>

        <div class="canvas-container" id="workspace" style="display:none;">
            <img id="sourceImage" alt="Upload source">
            <canvas id="interactiveCanvas"></canvas>
        </div>

        <div>
            <button id="clearBtn" disabled>Clear Clicks</button>
            <button id="processBtn" disabled>Run AI Extract Cutout</button>
        </div>

        <h3>Output PNG Result:</h3>
        <canvas id="resultCanvas"></canvas>
    </div>

<script>
    const status = document.getElementById('status');
    const imageUpload = document.getElementById('imageUpload');
    const workspace = document.getElementById('workspace');
    const sourceImage = document.getElementById('sourceImage');
    const interactiveCanvas = document.getElementById('interactiveCanvas');
    const interCtx = interactiveCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const resCtx = resultCanvas.getContext('2d');
    const processBtn = document.getElementById('processBtn');
    const clearBtn = document.getElementById('clearBtn');

    let interactiveSegmenter = null;
    let clickPoints = [];

    // 1. Loop Hook Timer to ensure scripts load completely before mounting
    async function tryInitializingAI() {
        // Safe check if CDN variables are fully attached to window context
        if (!window.mediapipe || !window.mediapipe.tasksVision) {
            status.innerText = "⏳ Connecting to Google Asset Repositories...";
            setTimeout(tryInitializingAI, 300); // Retry in 300ms if not ready
            return;
        }

        try {
            status.innerText = "⚡ Allocating WebGL Accelerators & Downloading Model Weights...";
            
            const { FilesetResolver, InteractiveSegmenter } = window.mediapipe.tasksVision;
            const visionWasmFiles = await FilesetResolver.forVisionTasks(
                "https://jsdelivr.net"
            );

            interactiveSegmenter = await InteractiveSegmenter.createFromOptions(visionWasmFiles, {
                baseOptions: {
                    modelAssetPath: "https://googleapis.com",
                    delegate: "GPU" // Utilizes GPU acceleration inside the main thread directly
                },
                outputCategoryMask: true,
                outputConfidenceMask: false
            });

            status.innerText = "🚀 AI Engine Core Online! Please upload your photo.";
        } catch (err) {
            status.innerText = "❌ Initialization Critical Error.";
            console.error(err);
        }
    }
    // Launch the connection loop immediately
    tryInitializingAI();

    // 2. Manage File Selection Lifecycle
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files;
        if (!file || file.length === 0) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            sourceImage.src = event.target.result;
            sourceImage.onload = () => {
                workspace.style.display = 'inline-block';
                
                // Align visual selection borders with coordinate dimensions
                interactiveCanvas.width = sourceImage.clientWidth;
                interactiveCanvas.height = sourceImage.clientHeight;
                
                clickPoints = [];
                interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
                resCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
                
                clearBtn.disabled = false;
                processBtn.disabled = false;
                status.innerText = "🎯 Click on your subject AND your background text ('Chloe') to protect them.";
            };
        };
        reader.readAsDataURL(file[0]);
    });

    // 3. Register Click Points Map
    interactiveCanvas.addEventListener('click', (e) => {
        const rect = interactiveCanvas.getBoundingClientRect();
        
        // Normalize coordinates to 0.0 - 1.0 range required by MediaPipe
        const x = (e.clientX - rect.left) / interactiveCanvas.width;
        const y = (e.clientY - rect.top) / interactiveCanvas.height;

        clickPoints.push({ x, y });

        // Draw indicator dot marker over user selection
        interCtx.fillStyle = '#00ffcc';
        interCtx.beginPath();
        interCtx.arc(e.clientX - rect.left, e.clientY - rect.top, 7, 0, 2 * Math.PI);
        interCtx.fill();
    });

    clearBtn.addEventListener('click', () => {
        clickPoints = [];
        interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
        resCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        status.innerText = "Points cleared. Mark new points.";
    });

    // 4. Sequential Core Segment Blending
    processBtn.addEventListener('click', async () => {
        if (!interactiveSegmenter) return;
        if (clickPoints.length === 0) {
            alert("Please tap on at least one section layer to save first!");
            return;
        }

        status.innerText = "⚡ Processing layers and refining composite masks...";

        const trueWidth = sourceImage.naturalWidth;
        const trueHeight = sourceImage.naturalHeight;
        resultCanvas.width = trueWidth;
        resultCanvas.height = trueHeight;

        // Create an empty mask matrix layer
        const masterCompositeMask = new Uint8Array(trueWidth * trueHeight).fill(0);

        // Process each coordinate click sequentially using Async-Await steps
        for (let pt of clickPoints) {
            const userTargetPrompt = { keypoint: { x: pt.x, y: pt.y } };

            await new Promise((resolve) => {
                interactiveSegmenter.segment(sourceImage, userTargetPrompt, (inferenceOutput) => {
                    const localMaskArray = inferenceOutput.categoryMask.getAsUint8Array();

                    // Logical OR Evaluation: Combine pixels marked by any point
                    for (let index = 0; index < localMaskArray.length; index++) {
                        if (localMaskArray[index] > 0) {
                            masterCompositeMask[index] = 255;
                        }
                    }
                    resolve();
                });
            });
        }

        // 5. Final Canvas Output Generation
        resCtx.drawImage(sourceImage, 0, 0, trueWidth, trueHeight);
        const imageFramePixels = resCtx.getImageData(0, 0, trueWidth, trueHeight);

        // Map mask arrays onto base frame alpha channel properties
        for (let i = 0; i < masterCompositeMask.length; i++) {
            const pixelAlphaByteIndex = (i * 4) + 3;
            if (masterCompositeMask[i] === 0) {
                imageFramePixels.data[pixelAlphaByteIndex] = 0; // Erase background pixel
            }
        }

        resCtx.putImageData(imageFramePixels, 0, 0);
        status.innerText = "🎉 Process complete! Target subject and text preserved together.";
    });
</script>
</body>
</html>
