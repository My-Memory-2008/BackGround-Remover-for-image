<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Meta SAM 2 Background Keeper</title>
    <!-- Import HuggingFace Transformers.js via ESM Module CDN -->
    <script type="module">
        import { pipeline, AutoProcessor, AutoModel } from 'https://jsdelivr.net';
        window.XenovaAI = { pipeline, AutoProcessor, AutoModel };
    </script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .canvas-container { position: relative; display: inline-block; border: 2px dashed #444; margin-top: 15px; }
        #sourceImage { max-width: 100%; display: block; max-height: 60vh; }
        #interactiveCanvas { position: absolute; top:0; left:0; width:100%; height:100%; cursor: crosshair; }
        button, input { padding: 10px 20px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
        #processBtn { background: #28a745; color: white; }
        #clearBtn { background: #dc3545; color: white; }
        #status { background: #222; padding: 10px; border-radius: 8px; border: 1px solid #333; color: #ffc107; }
        #resultCanvas { margin-top: 20px; border: 2px solid #00ffcc; max-width: 100%; background-image: repeating-conic-gradient(#333 0% 25%, #222 0% 50%); background-size: 20px 20px; }
    </style>
</head>
<body>

    <h1>Serverless SAM 2 Object Recovery</h1>
    <p>Runs 100% in your browser for free via WebGPU. Click your subject AND background words like "Chloe" to keep them!</p>

    <div class="container">
        <input type="file" id="imageUpload" accept="image/*">
        <div id="status">⏳ Initializing SAM 2 Model Engine via WebGPU...</div>

        <div class="canvas-container" id="workspace" style="display:none;">
            <img id="sourceImage" alt="Upload source">
            <canvas id="interactiveCanvas"></canvas>
        </div>

        <div>
            <button id="clearBtn">Clear Clicks</button>
            <button id="processBtn" disabled>Generate Dynamic Cutout</button>
        </div>

        <h3>Output PNG Layer:</h3>
        <canvas id="resultCanvas"></canvas>
    </div>

<script type="module">
    const status = document.getElementById('status');
    const imageUpload = document.getElementById('imageUpload');
    const workspace = document.getElementById('workspace');
    const sourceImage = document.getElementById('sourceImage');
    const interactiveCanvas = document.getElementById('interactiveCanvas');
    const interCtx = interactiveCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const resCtx = resultCanvas.getContext('2d');
    const processBtn = document.getElementById('processBtn');
    const clearBtn = document.getElementById('clearBtn');

    let processor = null;
    let model = null;
    let clickPoints = [];
    let imageRawData = null;

    // 1. Initialize SAM 2 Model directly from HuggingFace CDN using WebGPU
    async function initSAM2() {
        try {
            // Check if user's browser supports WebGPU acceleration natively
            const hasWebGPU = navigator.gpu ? 'webgpu' : 'wasm';
            status.innerText = `Loading Meta SAM 2 (Using ${hasWebGPU.toUpperCase()} engine)...`;

            // Load optimized, client-side tiny Hiera weights from HuggingFace
            processor = await window.XenovaAI.AutoProcessor.from_pretrained('Xenova/sam2-hiera-tiny');
            model = await window.XenovaAI.AutoModel.from_pretrained('Xenova/sam2-hiera-tiny', {
                device: hasWebGPU, // Use hardware WebGPU or fallback gracefully to CPU WASM
                dataType: 'fp16'   // Quantized for lightning fast execution
            });

            status.innerText = "🚀 SAM 2 Ready! Upload an image file to begin.";
        } catch (err) {
            status.innerText = "❌ Initialization Error. Ensure your browser supports WebGPU.";
            console.error(err);
        }
    }
    // Wait for the scripts to mount globally, then initialize
    setTimeout(initSAM2, 1000);

    // 2. Handle Client Upload File Matrix Mapping
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            sourceImage.src = event.target.result;
            sourceImage.onload = () => {
                workspace.style.display = 'inline-block';
                interactiveCanvas.width = sourceImage.clientWidth;
                interactiveCanvas.height = sourceImage.clientHeight;
                
                clickPoints = [];
                interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
                processBtn.disabled = false;
                status.innerText = "🎯 Click on the foreground object AND your background text ('Chloe').";
            };
        };
        reader.readAsDataURL(file);
    });

    // 3. Collect Relative Click Coordinates
    interactiveCanvas.addEventListener('click', (e) => {
        const rect = interactiveCanvas.getBoundingClientRect();
        // Convert to absolute pixel coordinates on the displayed image frame dimensions
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Save normalized coordinates required by SAM API formatting
        clickPoints.push({
            point: [ (x / interactiveCanvas.width) * sourceImage.naturalWidth, (y / interactiveCanvas.height) * sourceImage.naturalHeight ],
            label: 1 // 1 means foreground/keep, 0 means background/remove
        });

        // Draw a green tracking node dot overlay indicator
        interCtx.fillStyle = '#00ffcc';
        interCtx.beginPath();
        interCtx.arc(x, y, 6, 0, 2 * Math.PI);
        interCtx.fill();
    });

    clearBtn.addEventListener('click', () => {
        clickPoints = [];
        interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
        status.innerText = "Cleared. Re-click target zones.";
    });

    // 4. Run Serverless Local SAM 2 Segmentation Pipeline
    processBtn.addEventListener('click', async () => {
        if (clickPoints.length === 0) {
            alert("Click on at least one area to keep first!");
            return;
        }

        status.innerText = "⚡ Running SAM 2 on your graphics card...";

        // Extract raw image data properties
        const inputs = await processor(sourceImage);
        
        // Structure raw array points into model-ready execution tensors
        const inputPoints = clickPoints.map(p => p.point);
        const inputLabels = clickPoints.map(p => p.label);

        // Run local model inference pipeline block
        const outputs = await model({
            ...inputs,
            input_points: [inputPoints],
            input_labels: [inputLabels]
        });

        // 5. Render Generated Transparent Mask on Base Canvas Element
        const trueWidth = sourceImage.naturalWidth;
        const trueHeight = sourceImage.naturalHeight;
        resultCanvas.width = trueWidth;
        resultCanvas.height = trueHeight;

        // Draw the base source file textures down
        resCtx.drawImage(sourceImage, 0, 0, trueWidth, trueHeight);
        const frameImgData = resCtx.getImageData(0, 0, trueWidth, trueHeight);

        // Read SAM 2 mask array prediction response dimensions (0 = background, 1 = item)
        const samMaskData = outputs.pred_masks.data; 

        // Loop over individual frame byte maps to drop unwanted background elements
        for (let i = 0; i < samMaskData.length; i++) {
            const pixelAlphaByteIndex = (i * 4) + 3;
            // If SAM 2 returns false/0, erase the pixel by making transparency 0
            if (samMaskData[i] === 0) {
                frameImgData.data[pixelAlphaByteIndex] = 0;
            }
        }

        // Render clean structural cutout to UI output canvas frame 
        resCtx.putImageData(frameImgData, 0, 0);
        status.innerText = "🎉 Cutout compiled successfully using WebGPU!";
    });
</script>
</body>
</html>
