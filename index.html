<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ClearCut.AI — Canvas Masking (Fixed)</title>
    <style>
        body { background: #0a0f1d; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .drop-zone {
            border: 2px dashed #444; padding: 40px; text-align: center;
            cursor: pointer; margin-bottom: 20px;
        }
        #drawing-canvas { position: absolute; top: 0; left: 0; z-index: 10; }
        .controls { display: flex; gap: 10px; margin: 15px 0; }
        button { padding: 8px 16px; background: #222; border: 1px solid #444; color: white; }
        button.active { background: #a855f7; }
        .preview { position: relative; display: inline-block; }
        .status { color: #a855f7; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>✅ Canvas Masking Background Remover (Fixed)</h1>
    <p>Draw over areas you want to KEEP (white), then click "Process".</p>

    <div class="drop-zone" id="drop-zone">Drag & drop image here or click to browse</div>
    <input type="file" id="file-input" accept="image/*" style="display:none">

    <div class="controls">
        <button id="btn-brush" class="active">✏️ Brush</button>
        <button id="btn-rect">▭ Rectangle</button>
        <button id="btn-clear">🗑️ Clear</button>
        <button id="btn-process">▶️ Process</button>
    </div>

    <div class="status" id="status"></div>

    <div class="preview" id="preview">
        <img id="img" style="max-width: 100%; display: none;">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <div style="margin-top: 20px;">
        <a id="download-link" download="cutout.png" style="display:none;">📥 Download Result</a>
    </div>
</div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

// DOM elements
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const imgEl = document.getElementById('img');
const canvasEl = document.getElementById('drawing-canvas');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const downloadLink = document.getElementById('download-link');

const btnBrush = document.getElementById('btn-brush');
const btnRect = document.getElementById('btn-rect');
const btnClear = document.getElementById('btn-clear');
const btnProcess = document.getElementById('btn-process');

// State
let ctx, img, drawing = false, tool = 'brush';
let userMaskCanvas, userMaskCtx;

// Setup canvas to match image size (will be set after image loads)
function setupCanvas() {
    if (!img) {
        status("❌ Cannot setup canvas: no image loaded");
        return;
    }
    canvasEl.width = img.naturalWidth;
    canvasEl.height = img.naturalHeight;
    ctx = canvasEl.getContext('2d');
    
    // User mask canvas (for merging later)
    userMaskCanvas = document.createElement('canvas');
    userMaskCanvas.width = img.naturalWidth;
    userMaskCanvas.height = img.naturalHeight;
    userMaskCtx = userMaskCanvas.getContext('2d');
    userMaskCtx.fillStyle = 'black';
    userMaskCtx.fillRect(0, 0, img.naturalWidth, img.naturalHeight);
    status("✅ Canvas setup complete");
}

// Draw tools
btnBrush.addEventListener('click', () => { tool = 'brush'; btnBrush.classList.add('active'); btnRect.classList.remove('active'); });
btnRect.addEventListener('click', () => { tool = 'rect'; btnRect.classList.add('active'); btnBrush.classList.remove('active'); });
btnClear.addEventListener('click', () => {
    if(ctx) {
        ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    if(userMaskCtx) {
        userMaskCtx.fillStyle = 'black';
        userMaskCtx.fillRect(0, 0, img.naturalWidth, img.naturalHeight);
    }
    status('✓ Drawing cleared');
});

// Drag & Drop / File Input
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    loadImg(URL.createObjectURL(file));
});

['dragenter', 'dragover'].forEach(ev => {
    dropZone.addEventListener(ev, e => {
        e.preventDefault();
        dropZone.style.borderColor = '#a855f7';
    });
});
['dragleave', 'drop'].forEach(ev => {
    dropZone.addEventListener(ev, e => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        if (ev === 'drop' && e.dataTransfer.files[0]) {
            const file = e.dataTransfer.files[0];
            loadImg(URL.createObjectURL(file));
        }
    });
});

// Load image
function loadImg(url) {
    status('⏳ Loading image...');
    img = new Image();
    img.onload = () => {
        imgEl.src = url;
        imgEl.style.display = 'inline';
        setupCanvas(); // Call setup AFTER image loads
        status('✅ Image loaded. Draw over areas to KEEP (white).');
    };
    img.onerror = () => status('❌ Failed to load image');
    img.src = url;
}

// Drawing logic
canvasEl.addEventListener('mousedown', e => {
    if (!img) {
        status("❌ Load an image first!");
        return;
    }
    drawing = true;
    const rect = canvasEl.getBoundingClientRect();
    // Scale mouse coordinates to canvas coordinates
    const x = (e.clientX - rect.left) * (canvasEl.width / rect.width);
    const y = (e.clientY - rect.top) * (canvasEl.height / rect.height);
    
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    if (tool === 'brush') {
        ctx.beginPath();
        ctx.moveTo(x, y);
    } else if (tool === 'rect') {
        window.rectStart = {x, y};
    }
});

canvasEl.addEventListener('mousemove', e => {
    if (!drawing || !img) return;
    const rect = canvasEl.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvasEl.width / rect.width);
    const y = (e.clientY - rect.top) * (canvasEl.height / rect.height);
    
    if (tool === 'brush') {
        ctx.lineTo(x, y);
        ctx.stroke();
        // Update user mask
        userMaskCtx.strokeStyle = 'white';
        userMaskCtx.lineWidth = 20;
        userMaskCtx.lineCap = 'round';
        userMaskCtx.beginPath();
        userMaskCtx.moveTo(x, y);
        userMaskCtx.lineTo(x, y);
        userMaskCtx.stroke();
    } else if (tool === 'rect' && window.rectStart) {
        // Temporarily clear and redraw for preview
        ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        // Draw existing drawing if any (this is just for visual feedback during drawing)
        // In a more complex scenario, you might store paths separately
        // For now, just show the rectangle being drawn
        const w = x - window.rectStart.x;
        const h = y - window.rectStart.y;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(window.rectStart.x, window.rectStart.y, w, h);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.strokeRect(window.rectStart.x, window.rectStart.y, w, h);
    }
});

canvasEl.addEventListener('mouseup', () => {
    if (!drawing || !img) return;
    drawing = false;
    
    if (tool === 'rect' && window.rectStart) {
        const x = window.rectStart.x;
        const y = window.rectStart.y;
        // Calculate final width/height based on last mouse position
        const rect = canvasEl.getBoundingClientRect();
        const finalX = (canvasEl.width / rect.width) * (rect.right - rect.left);
        const finalY = (canvasEl.height / rect.height) * (rect.bottom - rect.top);
        const w = finalX - x;
        const h = finalY - y;

        // Finalize rectangle on user mask
        userMaskCtx.fillStyle = 'white';
        userMaskCtx.fillRect(x, y, w, h);
        // Draw final rectangle on drawing canvas too
        ctx.fillStyle = 'white';
        ctx.fillRect(x, y, w, h);
        status('✓ Rectangle added to keep zone');
        delete window.rectStart;
    }
});


// Process button
btnProcess.addEventListener('click', async () => {
    if (!img) {
        status('❌ No image loaded');
        return;
    }
    if (!userMaskCanvas) {
        status('❌ Internal error: Canvas not initialized');
        return;
    }

    try {
        status('⏳ Processing... (downscaling if needed)');
        
        // ⚠️ Critical: Downscale large images to avoid OOM
        const MAX_DIM = 1500;
        let srcImg = img;
        let scale = 1;
        if (img.naturalWidth > MAX_DIM || img.naturalHeight > MAX_DIM) {
            scale = Math.min(MAX_DIM / img.naturalWidth, MAX_DIM / img.naturalHeight);
            const scaledCanvas = document.createElement('canvas');
            scaledCanvas.width = img.naturalWidth * scale;
            scaledCanvas.height = img.naturalHeight * scale;
            const scaledCtx = scaledCanvas.getContext('2d');
            scaledCtx.drawImage(img, 0, 0, scaledCanvas.width, scaledCanvas.height);
            srcImg = await bitmapFromCanvas(scaledCanvas);
             // Adjust user mask scale if needed (important!)
             const scaledMaskCanvas = document.createElement('canvas');
             scaledMaskCanvas.width = userMaskCanvas.width * scale;
             scaledMaskCanvas.height = userMaskCanvas.height * scale;
             const scaledMaskCtx = scaledMaskCanvas.getContext('2d');
             scaledMaskCtx.drawImage(userMaskCanvas, 0, 0, scaledMaskCanvas.width, scaledMaskCanvas.height);
             // Use scaled mask for processing
             const aiBlob = await removeBackground(srcImg);
             const aiImg = await blobToImage(aiBlob);

             // Create final canvas for result
             const finalCanvas = document.createElement('canvas');
             finalCanvas.width = scaledCanvas.width;
             finalCanvas.height = scaledCanvas.height;
             const finalCtx = finalCanvas.getContext('2d');
             finalCtx.drawImage(srcImg, 0, 0);

             // Get pixel data from scaled sources
             const origData = finalCtx.getImageData(0, 0, scaledCanvas.width, scaledCanvas.height);
             const aiData = getCanvasImageData(aiImg, scaledCanvas.width, scaledCanvas.height);
             const userMaskData = getCanvasImageData(scaledMaskCanvas, scaledCanvas.width, scaledCanvas.height);

             // Check if data exists before accessing .data
             if (!aiData || !aiData.data || !userMaskData || !userMaskData.data || !origData || !origData.data) {
                 throw new Error("Failed to retrieve pixel data from AI result or user mask.");
             }

             // Step 3: Merge masks (Logical OR)
             for (let i = 0; i < origData.data.length; i += 4) {
                 const aiAlpha = aiData.data[i + 3];      // 0-255
                 const userAlpha = userMaskData.data[i + 3]; // 0-255
                 // Keep if AI OR user says "keep"
                 origData.data[i + 3] = (aiAlpha > 30 || userAlpha > 30) ? 255 : 0;
             }

             finalCtx.putImageData(origData, 0, 0);

             // Output
             const resultBlob = await new Promise(resolve => {
                 finalCanvas.toBlob(resolve, 'image/png');
             });
             const url = URL.createObjectURL(resultBlob);
             downloadLink.href = url;
             downloadLink.style.display = 'inline';
             downloadLink.textContent = `📥 Download Scaled (${Math.round(resultBlob.size/1024)} KB)`;
             status('✅ Done! Click download to save (scaled image).');
             return; // Exit after processing scaled version
        }


        // --- Process Original Size ---
        // Step 1: Run AI background removal
        status('🧠 Running AI background removal...');
        const aiBlob = await removeBackground(srcImg);
        const aiImg = await blobToImage(aiBlob); // Convert AI result blob to image

        // Step 2: Create final canvas
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = srcImg.naturalWidth;
        finalCanvas.height = srcImg.naturalHeight;
        const finalCtx = finalCanvas.getContext('2d');

        // Draw original image
        finalCtx.drawImage(srcImg, 0, 0);

        // Get pixel data
        const origData = finalCtx.getImageData(0, 0, srcImg.naturalWidth, srcImg.naturalHeight);
        const aiData = getCanvasImageData(aiImg, srcImg.naturalWidth, srcImg.naturalHeight); // Pass actual image dims
        const userMaskData = getCanvasImageData(userMaskCanvas, srcImg.naturalWidth, srcImg.naturalHeight); // Pass actual image dims

        // CHECK: Ensure data exists before accessing .data
        if (!aiData || !aiData.data || !userMaskData || !userMaskData.data || !origData || !origData.data) {
            throw new Error("Failed to retrieve pixel data from AI result or user mask.");
        }

        // Step 3: Merge masks (Logical OR)
        for (let i = 0; i < origData.data.length; i += 4) {
            const aiAlpha = aiData.data[i + 3];      // 0-255
            const userAlpha = userMaskData.data[i + 3]; // 0-255
            // Keep if AI OR user says "keep"
            origData.data[i + 3] = (aiAlpha > 30 || userAlpha > 30) ? 255 : 0;
        }

        finalCtx.putImageData(origData, 0, 0);

        // Step 4: Output
        const resultBlob = await new Promise(resolve => {
            finalCanvas.toBlob(resolve, 'image/png');
        });
        const url = URL.createObjectURL(resultBlob);
        downloadLink.href = url;
        downloadLink.style.display = 'inline';
        downloadLink.textContent = `📥 Download (${Math.round(resultBlob.size/1024)} KB)`;
        status('✅ Done! Click download to save.');

    } catch (err) {
        console.error(err);
        status(`❌ Error: ${err.message || 'Unknown error during processing'}`);
    }
});

// Helper: Convert canvas to ImageBitmap
async function bitmapFromCanvas(canvas) {
    return createImageBitmap(canvas);
}

// Helper: Convert blob to Image
function blobToImage(blob) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = URL.createObjectURL(blob);
    });
}

// Helper: Get image data from any source (Image, Canvas, etc.)
function getCanvasImageData(source, w, h) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tempCtx = tempCanvas.getContext('2d');
    // IMPORTANT: Check if source is valid before drawing
    if (!source || !tempCtx) {
        console.error("Invalid source or context in getCanvasImageData");
        return null; // Return null to signal failure
    }
    try {
        tempCtx.drawImage(source, 0, 0, w, h);
        return tempCtx.getImageData(0, 0, w, h);
    } catch (e) {
        console.error("Error drawing source in getCanvasImageData:", e);
        return null; // Return null to signal failure
    }
}

// Status helper
function status(msg) {
    statusEl.textContent = msg;
    console.log(msg); // Also log to console for debugging
}

// Initial state
status('👉 Upload an image to begin');
</script>
</body>
</html>
