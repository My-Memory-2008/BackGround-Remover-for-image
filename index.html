<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash-Proof WebGPU Background Keeper</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .canvas-container { position: relative; display: inline-block; border: 2px dashed #444; margin-top: 15px; }
        #sourceImage { max-width: 100%; display: block; max-height: 60vh; }
        #interactiveCanvas { position: absolute; top:0; left:0; width:100%; height:100%; cursor: crosshair; }
        button, input { padding: 10px 20px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
        #processBtn { background: #28a745; color: white; }
        #clearBtn { background: #dc3545; color: white; }
        #status { background: #222; padding: 12px; border-radius: 8px; border: 1px solid #333; color: #ffc107; font-weight: bold; min-width: 300px; }
        #resultCanvas { margin-top: 20px; border: 2px solid #00ffcc; max-width: 100%; background-image: repeating-conic-gradient(#333 0% 25%, #222 0% 50%); background-size: 20px 20px; }
    </style>
</head>
<body>

    <h1>Meta SAM 2 Background Keeper</h1>
    <p>Click your subject AND background words like "Chloe" to keep them. Uses isolated Web Workers.</p>

    <div class="container">
        <input type="file" id="imageUpload" accept="image/*">
        <div id="status">⏳ Spawning Background Engine Worker Thread...</div>

        <div class="canvas-container" id="workspace" style="display:none;">
            <img id="sourceImage" alt="Upload source">
            <canvas id="interactiveCanvas"></canvas>
        </div>

        <div>
            <button id="clearBtn">Clear Clicks</button>
            <button id="processBtn" disabled>Generate Dynamic Cutout</button>
        </div>

        <h3>Output PNG Layer:</h3>
        <canvas id="resultCanvas"></canvas>
    </div>

<script>
    const status = document.getElementById('status');
    const imageUpload = document.getElementById('imageUpload');
    const workspace = document.getElementById('workspace');
    const sourceImage = document.getElementById('sourceImage');
    const interactiveCanvas = document.getElementById('interactiveCanvas');
    const interCtx = interactiveCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const resCtx = resultCanvas.getContext('2d');
    const processBtn = document.getElementById('processBtn');
    const clearBtn = document.getElementById('clearBtn');

    let clickPoints = [];
    let aiWorker = null;

    // 1. Initialize Thread Worker
    function initWorker() {
        // Spawn background worker using modern ECMAScript module options
        aiWorker = new Worker('./worker.js', { type: 'module' });
        
        // Trigger model loading sequence inside worker
        aiWorker.postMessage({ action: 'load' });

        // Catch messages back from the worker
        aiWorker.onmessage = function(e) {
            const data = e.data;

            if (data.status === 'ready') {
                status.innerText = "🚀 SAM 2 Ready! Upload an image file to begin.";
            } else if (data.status === 'complete') {
                renderMaskResult(data.maskData);
            } else if (data.status === 'error') {
                status.innerText = `❌ Error: ${data.error}`;
            } else {
                // Display general loading milestones
                status.innerText = data.status;
            }
        };
    }
    initWorker();

    // 2. Handle Image Selection
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            sourceImage.src = event.target.result;
            sourceImage.onload = () => {
                workspace.style.display = 'inline-block';
                interactiveCanvas.width = sourceImage.clientWidth;
                interactiveCanvas.height = sourceImage.clientHeight;
                
                clickPoints = [];
                interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
                resCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
                processBtn.disabled = false;
                status.innerText = "🎯 Click on your subject AND your background text ('Chloe') to save them.";
            };
        };
        reader.readAsDataURL(file);
    });

    // 3. Track Click Metrics
    interactiveCanvas.addEventListener('click', (e) => {
        const rect = interactiveCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        clickPoints.push({
            point: [ (x / interactiveCanvas.width) * sourceImage.naturalWidth, (y / interactiveCanvas.height) * sourceImage.naturalHeight ],
            label: 1
        });

        interCtx.fillStyle = '#00ffcc';
        interCtx.beginPath();
        interCtx.arc(x, y, 6, 0, 2 * Math.PI);
        interCtx.fill();
    });

    clearBtn.addEventListener('click', () => {
        clickPoints = [];
        interCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
        resCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        status.innerText = "Tracking points cleared.";
    });

    // 4. Pass Data to Background Thread Worker
    processBtn.addEventListener('click', () => {
        if (clickPoints.length === 0) {
            alert("Click on areas you want to keep first!");
            return;
        }

        status.innerText = "⚡ Worker processing mask on background thread...";

        // Temporarily draw image to a canvas to extract raw ImageData pixels safely
        const canvasTemp = document.createElement('canvas');
        canvasTemp.width = sourceImage.naturalWidth;
        canvasTemp.height = sourceImage.naturalHeight;
        const ctxTemp = canvasTemp.getContext('2d');
        ctxTemp.drawImage(sourceImage, 0, 0);
        const rawImageData = ctxTemp.getImageData(0, 0, canvasTemp.width, canvasTemp.height);

        // Ship the pixel array and clicks over to worker.js
        aiWorker.postMessage({
            action: 'segment',
            imageData: rawImageData,
            clickPoints: clickPoints
        });
    });

    // 5. Draw Final Transparency Composition Mask
    function renderMaskResult(samMaskData) {
        const trueWidth = sourceImage.naturalWidth;
        const trueHeight = sourceImage.naturalHeight;
        resultCanvas.width = trueWidth;
        resultCanvas.height = trueHeight;

        resCtx.drawImage(sourceImage, 0, 0, trueWidth, trueHeight);
        const frameImgData = resCtx.getImageData(0, 0, trueWidth, trueHeight);

        for (let i = 0; i < samMaskData.length; i++) {
            const pixelAlphaByteIndex = (i * 4) + 3;
            if (samMaskData[i] === 0) {
                frameImgData.data[pixelAlphaByteIndex] = 0;
            }
        }

        resCtx.putImageData(frameImgData, 0, 0);
        status.innerText = "🎉 Process complete! Mask compiled safely via background thread.";
    }
</script>
</body>
</html>
